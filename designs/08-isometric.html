<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>08 · Isometric</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
:root{--bg:#eef2f7;--k:#1e293b;--g:#64748b;--in:#4f46e5;--co:#f97362;--am:#fbbf24;--mi:#34d399}
.slide{background:radial-gradient(900px 600px at 70% 40%,#ffffff,transparent 70%),var(--bg);color:var(--k);font-family:'Lexend',sans-serif}
.hd{position:absolute;left:72px;top:58px}
.hd small{font-size:14px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--in)}
.hd h2{font-size:46px;font-weight:700;letter-spacing:-.02em;line-height:1.05;margin-top:8px}
.hd h2 em{font-style:normal;color:var(--co)}
.iso{position:absolute;left:0;top:0;width:1280px;height:720px}
.iso text{font-family:'Lexend'}
.box{transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.box .t{fill:var(--t)}.box .l{fill:var(--l)}.box .r{fill:var(--r)}
.box polygon{stroke:rgba(30,41,59,.18);stroke-width:1;stroke-linejoin:round;transition:fill .4s}
.gh polygon{fill:none!important;stroke:rgba(30,41,59,.3);stroke-dasharray:5 5}
.tile{--t:#dfe5ee;--l:#c6cfdc;--r:#b3becd}
.tile.in{--t:#8b85f0;--l:#4f46e5;--r:#3b33c4}
.tile.now{--t:#fcd34d;--l:#fbbf24;--r:#d99e0b;transform:translateY(-34px)}
.floor{opacity:0;transform:translateY(-60px)}
.floor.in{opacity:1;transform:none;--t:#8b85f0;--l:#4f46e5;--r:#3b33c4}
.floor.now{--t:#fda394;--l:#f97362;--r:#d9533f}
.road{stroke:#cbd5e1;stroke-width:16;stroke-linecap:round;transition:stroke .35s}
.road.now{stroke:var(--am)}
.dest{--t:#dfe5ee;--l:#c6cfdc;--r:#b3becd}
.dest.in{--t:#7ce3bd;--l:#34d399;--r:#1fae7a}
.dest.now{--t:#fcd34d;--l:#fbbf24;--r:#d99e0b}
.card{position:absolute;right:72px;top:220px;width:400px;height:330px}
.card>div{position:absolute;inset:0;background:#fff;border-radius:18px;padding:32px 34px;box-shadow:0 24px 48px -20px rgba(30,41,59,.25);opacity:0;transform:translateY(12px);transition:opacity .4s,transform .4s}
.card>div.now{opacity:1;transform:none}
.card .ic{width:70px;height:70px;padding:14px;border-radius:16px;background:#eef0ff;color:var(--in);--isw:2.2;--ia:rgba(79,70,229,.2);margin-bottom:22px}
.card small{font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--g)}
.card b{display:block;font-size:28px;font-weight:700;line-height:1.15;margin:8px 0 12px;letter-spacing:-.01em}
.card p{font-size:19px;color:var(--g);line-height:1.4}
.tag{position:absolute;font-size:15px;font-weight:600;transform:translate(-50%,-100%);white-space:nowrap;color:var(--g);transition:color .3s}
.tag.now{color:var(--k);font-weight:700}
.lab{position:absolute;display:flex;align-items:center;gap:14px}
.lab .ic{width:54px;height:54px;padding:10px;border-radius:14px;background:#fff;box-shadow:0 8px 20px -10px rgba(30,41,59,.35);--isw:2.2}
.lab b{display:block;font-size:24px}
.lab span{font-size:16px;color:var(--g)}

/* cover */
.cv{position:absolute;left:72px;top:190px;width:500px}
.cv h1{font-size:88px;font-weight:800;line-height:.98;letter-spacing:-.04em;margin:16px 0 22px}
.cv h1 em{font-style:normal;color:var(--in)}
.cv p{font-size:22px;color:var(--g)}
.note{position:absolute;right:72px;top:72px;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--co);border:1.5px solid var(--co);border-radius:999px;padding:7px 14px}
.ty{position:absolute;left:72px;top:230px}
.ty h1{font-size:110px;font-weight:800;letter-spacing:-.05em;line-height:.95}
.ty h1 em{font-style:normal;color:var(--co)}
.ty p{font-size:22px;color:var(--g);margin-top:18px}
.ty .cr{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px;max-width:520px}
.ty .cr span{background:#fff;border-radius:999px;padding:9px 16px;font-size:16px;font-weight:600;box-shadow:0 6px 14px -8px rgba(30,41,59,.3)}
</style>
</head>
<body>
<div id="viewport"><main class="stage" id="stage"></main></div>
<script src="assets/content.js"></script>
<script src="assets/icons.js"></script>
<script src="assets/deck.js"></script>
<script>
(function () {
  var Y = C.years, S = [], K = '#1e293b', G = '#64748b';
  function shade(hex, f) { var n = parseInt(hex.slice(1), 16), c = [n >> 16, n >> 8 & 255, n & 255].map(function (v) { return Math.max(0, Math.min(255, Math.round(f > 0 ? v + (255 - v) * f : v * (1 + f)))); }); return 'rgb(' + c.join(',') + ')'; }
  var O = [0, 0];
  function P(i, j, k) { return [(O[0] + (i - j) * .866).toFixed(1), (O[1] + (i + j) * .5 - k).toFixed(1)]; }
  function poly(pts, c) { return '<polygon class="' + c + '" points="' + pts.map(function (p) { return p.join(','); }).join(' ') + '"/>'; }
  function box(i, j, a, b, h, col, cls, attr) {
    var st = col ? 'style="--t:' + shade(col, .35) + ';--l:' + col + ';--r:' + shade(col, -.2) + '"' : '';
    return '<g class="box ' + (cls || '') + '" ' + st + ' ' + (attr || '') + '>' +
      poly([P(i, j + b, h), P(i + a, j + b, h), P(i + a, j + b, 0), P(i, j + b, 0)], 'l') +
      poly([P(i + a, j, h), P(i + a, j + b, h), P(i + a, j + b, 0), P(i + a, j, 0)], 'r') +
      poly([P(i, j, h), P(i + a, j, h), P(i + a, j + b, h), P(i, j + b, h)], 't') + '</g>';
  }
  function sl(h) { S.push('<section class="slide">' + h + '</section>'); }
  function hd(s, h) { return '<div class="hd"><small>' + s + '</small><h2>' + h + '</h2></div>'; }
  var IN = '#4f46e5', CO = '#f97362', AM = '#fbbf24', MI = '#34d399', SL = '#94a3b8';

  /* 1 cover: stack */
  O = [900, 300];
  var cv = box(0, 0, 300, 300, 40, IN);
  for (var a = 0; a < 3; a++) for (var b = 0; b < 2; b++) cv += box(20 + a * 92, 30 + b * 130, 80, 110, 70 + (a + b) * 30, [CO, AM, MI][(a + b) % 3]);
  cv += box(110, 110, 80, 80, 260, K);
  sl('<div class="cv"><small style="font-size:14px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#4f46e5">' + C.org + '</small><h1>Built<br>block by<br><em>block</em></h1><p>How the team, the segments and the channels added up to this year.</p></div><svg class="iso" viewBox="0 0 1280 720">' + cv + '</svg>');

  /* 2 the plan: exploded layers */
  O = [560, 160];
  var ex = box(0, 0, 240, 240, 30, CO), ex2 = box(0, 0, 240, 240, 30, AM), ex3 = box(0, 0, 240, 240, 30, IN);
  var lay = '<g transform="translate(0 230)">' + ex3 + '</g><g transform="translate(0 115)">' + ex2 + '</g><g>' + ex + '</g>';
  var labs = [[C.pillars[2], 'Connections', 265], [C.pillars[1], 'Floors', 380], [C.pillars[0], 'Foundation', 495]];
  sl(hd('The plan', 'Three layers, <em>built in order</em>') + '<svg class="iso" viewBox="0 0 1280 720">' + lay + '</svg>' +
    labs.map(function (l, i) { return '<div class="lab" style="left:900px;top:' + (l[2] - 34) + 'px">' + I(l[0].i) + '<div><span>' + l[1] + '</span><b>' + l[0].s + '</b></div></div>'; }).join(''));

  /* 3 foundation: team tiles */
  O = [400, 300];
  var tl = '', order = [[0, 0], [1, 0], [0, 1], [2, 0], [1, 1], [2, 1]];
  var idx = { '0,0': 0, '1,0': 1, '2,0': 2, '0,1': 3, '1,1': 4, '2,1': 5 }, tg = '';
  order.forEach(function (q) { var n = idx[q[0] + ',' + q[1]]; tl += box(q[0] * 130, q[1] * 130, 116, 116, 34, null, 'tile', 'data-at="' + n + '" data-go="' + n + '"'); });
  order.forEach(function (q) { var n = idx[q[0] + ',' + q[1]], p = P(q[0] * 130 + 58, q[1] * 130 + 58, 34); tg += '<div class="tag" data-at="' + n + '" style="left:' + p[0] + 'px;top:' + (+p[1] + 80) + 'px">' + C.team[n].k + '</div>'; });
  sl(hd('Layer 1 · Foundation', 'The <em>team</em> came first') + '<svg class="iso" viewBox="0 0 1280 720">' + tl + '</svg>' +
    '<div class="card">' + C.team.map(function (p, i) { return '<div data-at="' + i + '">' + I(p.i) + '<small>Block ' + (i + 1) + ' of 6</small><b>' + p.t + '</b><p>' + p.l + '</p></div>'; }).join('') + '</div>');

  /* 4 floors: segments */
  O = [420, 505];
  var fl = box(0, 0, 220, 220, 20, SL);
  C.segment.forEach(function (p, i) { fl += '<g transform="translate(0 ' + (-20 - i * 62) + ')">' + box(10, 10, 200, 200, 56, null, 'gh') + '</g>'; });
  C.segment.forEach(function (p, i) { fl += '<g transform="translate(0 ' + (-20 - i * 62) + ')">' + box(10, 10, 200, 200, 56, null, 'floor', 'data-at="' + i + '"') + '</g>'; });
  var ft = C.segment.map(function (p, i) { var q = P(210, 110, 28); return '<div class="tag" data-at="' + i + '" style="left:' + (+q[0] + 140) + 'px;top:' + (+q[1] - 20 - i * 62 + 14) + 'px;transform:translate(0,-50%)">' + (i + 1) + ' · ' + p.k + '</div>'; }).join('');
  sl(hd('Layer 2 · Floors', 'Six segments, <em>one floor at a time</em>') + '<svg class="iso" viewBox="0 0 1280 720">' + fl + '</svg>' + ft +
    '<div class="card">' + C.segment.map(function (p, i) { return '<div data-at="' + i + '">' + I(p.i) + '<small>Floor ' + (i + 1) + ' of 6</small><b>' + p.t + '</b><p>' + p.l + '</p></div>'; }).join('') + '</div>');

  /* 5 connections: channels roads */
  O = [430, 210];
  var ci = 200, cj = 200, R = 230, rd = '', ds = [], dt = '';
  C.channels.forEach(function (p, i) {
    var a = (-120 + i * (300 / 6)) * Math.PI / 180, di = ci + R * Math.cos(a), dj = cj + R * Math.sin(a), A = P(ci, cj, 0), B = P(di, dj, 0);
    rd += '<path class="road" data-at="' + i + '" d="M' + A[0] + ' ' + A[1] + 'L' + B[0] + ' ' + B[1] + '"/>';
    ds.push({ i: i, s: di + dj, h: box(di - 26, dj - 26, 52, 52, 46, null, 'dest', 'data-at="' + i + '" data-go="' + i + '"') });
    var T = P(di, dj, 46); dt += '<div class="tag" data-at="' + i + '" style="left:' + T[0] + 'px;top:' + (+T[1] - 30) + 'px">' + p.k + '</div>';
  });
  var hub = box(ci - 60, cj - 60, 120, 120, 150, IN), all = ds.concat([{ s: ci + cj, h: hub }]).sort(function (x, y) { return x.s - y.s; });
  sl(hd('Layer 3 · Connections', 'Seven roads <em>out to buyers</em>') + '<svg class="iso" viewBox="0 0 1280 720">' + rd + all.map(function (x) { return x.h; }).join('') + '</svg>' + dt +
    '<div class="card">' + C.channels.map(function (p, i) { return '<div data-at="' + i + '">' + I(p.i) + '<small>Road ' + (i + 1) + ' of 7</small><b>' + p.t + '</b><p>' + p.l + '</p></div>'; }).join('') + '</div>');

  /* 6 market: iso columns */
  O = [330, 540];
  var mc = '', ml = '';
  C.market.forEach(function (d, i) {
    var hot = d[0] === 'B', i0 = i * 64;
    mc += box(i0, -i0, 30, 30, d[1] * 22, hot ? shade(CO, .45) : '#c7cbf5') + box(i0 + 34, -i0, 30, 30, d[2] * 22, hot ? CO : IN);
    var p1 = P(i0 + 15, -i0 + 15, d[1] * 22), p2 = P(i0 + 49, -i0 + 15, d[2] * 22), pb = P(i0 + 32, -i0 + 50, 0);
    ml += '<text x="' + p1[0] + '" y="' + (+p1[1] - 12) + '" text-anchor="middle" font-size="15" fill="' + G + '">' + d[1] + '</text><text x="' + p2[0] + '" y="' + (+p2[1] - 12) + '" text-anchor="middle" font-size="17" font-weight="700" fill="' + (hot ? CO : K) + '">' + d[2] + '</text>' +
      '<text x="' + pb[0] + '" y="' + (+pb[1] + 30) + '" text-anchor="middle" font-size="22" font-weight="700" fill="' + (hot ? CO : K) + '">' + d[0] + '</text>';
  });
  sl(hd('The result · market', 'B built <em>the tallest</em>') + '<svg class="iso" viewBox="0 0 1280 720">' + mc + ml +
    '<rect x="960" y="120" width="16" height="16" rx="3" fill="#c7cbf5"/><text x="984" y="133" font-size="15" fill="' + G + '">' + Y[0] + '</text><rect x="1090" y="120" width="16" height="16" rx="3" fill="' + IN + '"/><text x="1114" y="133" font-size="15" fill="' + G + '">' + Y[1] + '</text></svg>');

  /* 7 growth: iso columns */
  O = [190, 560];
  var gc = '', gl = '';
  C.growth.forEach(function (d, i) {
    var i0 = i * 52, h = d[1] * 14, col = i < 3 ? AM : MI, p = P(i0 + 20, -i0 + 20, h), pb = P(i0 + 20, -i0 + 56, 0);
    gc += box(i0, -i0, 40, 40, h, col);
    gl += '<text x="' + p[0] + '" y="' + (+p[1] - 12) + '" text-anchor="middle" font-size="17" font-weight="700" fill="' + K + '">+' + d[1] + '%</text><text x="' + pb[0] + '" y="' + (+pb[1] + 26) + '" text-anchor="middle" font-size="14" fill="' + G + '">' + d[0] + '</text>';
  });
  sl(hd('The result · our lines', 'Every line <em>went up</em>') + '<div class="note">' + C.growthNote + '</div><svg class="iso" viewBox="0 0 1280 720">' + gc + gl + '</svg>');

  /* 8 close */
  O = [920, 380];
  var cl = box(0, 0, 260, 260, 26, SL) + box(30, 30, 200, 200, 60, IN) + box(50, 50, 160, 160, 160, CO) + box(80, 80, 100, 100, 260, AM);
  var tp = P(130, 130, 260);
  cl += '<path d="M' + tp[0] + ' ' + tp[1] + 'v-110" stroke="' + K + '" stroke-width="4"/><path d="M' + tp[0] + ' ' + (+tp[1] - 110) + 'l70 20-70 22z" fill="' + MI + '"/>';
  sl('<svg class="iso" viewBox="0 0 1280 720">' + cl + '</svg><div class="ty"><h1>Thank<br><em>you</em></h1><p>Every block was laid by the team.</p><div class="cr">' + C.credits.map(function (c) { return '<span>' + c + '</span>'; }).join('') + '</div></div>');

  Deck.render(S);
})();
</script>
</body>
</html>
